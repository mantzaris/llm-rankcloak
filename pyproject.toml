[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rankcloak"
version = "0.1.0"
description = "Research utilities for LLM rank-transcoding steganography over synthetic cryptographic artifacts."
requires-python = ">=3.8"
dependencies = [
    "huggingface_hub>=0.22",
    "numpy>=1.22",
    "pandas>=1.3",
    "matplotlib>=3.1",
    "tqdm>=4.66",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.3.5"]
dev = ["pytest>=8.0"]
analysis = ["scikit-learn>=1.0"]

[project.scripts]
rankcloak = "rankcloak.cli:main"

[tool.setuptools.packages.find]
include = ["rankcloak*"]
